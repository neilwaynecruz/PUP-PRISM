name: e2e

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    # Playwright 1.60 supports Ubuntu 24.04, but not the Ubuntu 26.04
    # image currently rolling out behind ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.e2e .env
          php artisan key:generate --force
          touch database/e2e.sqlite
          php artisan e2e:setup --fresh

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }} --workers=1 --shard=${{ matrix.shard }}/2
        env:
          CI: true
          E2E_APP_URL: http://127.0.0.1:8001

      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            tests/e2e/report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
