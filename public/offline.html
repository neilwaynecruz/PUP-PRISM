<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0f172a" />
        <title>You are offline | PUP PRISM</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                --background: #f8fafc;
                --surface: #ffffff;
                --border: #e2e8f0;
                --heading: #0f172a;
                --text: #475569;
                --accent: #1d4ed8;
                --accent-soft: #eff6ff;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 1rem;
                box-sizing: border-box;
                background: var(--background);
                color: var(--text);
            }

            main {
                width: min(30rem, 100%);
                border: 1px solid var(--border);
                border-radius: 1rem;
                padding: clamp(1.25rem, 5vw, 2rem);
                box-sizing: border-box;
                background: var(--surface);
                box-shadow: 0 16px 40px rgb(15 23 42 / 8%);
            }

            .brand {
                width: 3.25rem;
                height: 3.25rem;
                object-fit: contain;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                border-radius: 999px;
                margin-top: 1rem;
                background: var(--accent-soft);
                color: var(--accent);
                padding: 0.45rem 0.75rem;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .badge::before {
                content: '';
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 999px;
                background: #3b82f6;
            }

            h1 {
                margin: 1rem 0 0.5rem;
                color: var(--heading);
                font-size: clamp(1.5rem, 6vw, 1.875rem);
                line-height: 1.25;
            }

            p {
                margin: 0 0 0.75rem;
                line-height: 1.5;
            }

            .notice {
                margin-top: 1rem;
                border-left: 3px solid var(--accent);
                padding: 0.75rem 1rem;
                background: var(--accent-soft);
                color: var(--heading);
                font-size: 0.875rem;
            }

            button {
                width: 100%;
                min-height: 2.75rem;
                margin-top: 1.25rem;
                border: 0;
                border-radius: 0.625rem;
                padding: 0.75rem 1rem;
                background: var(--accent);
                color: #ffffff;
                font: inherit;
                font-weight: 650;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid #93c5fd;
                outline-offset: 3px;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #020617;
                    --surface: #0f172a;
                    --border: #334155;
                    --heading: #f8fafc;
                    --text: #cbd5e1;
                    --accent: #60a5fa;
                    --accent-soft: #172554;
                }

                button {
                    background: #2563eb;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img
                class="brand"
                src="/Icons/prism-icon-192x192.png"
                alt="PUP PRISM"
            />
            <div class="badge">Connection unavailable</div>
            <h1>You are offline</h1>
            <p>
                Connect to Wi-Fi or mobile data, then try again to continue
                working in PUP PRISM.
            </p>
            <p class="notice">
                No new inventory changes have been saved or submitted while this
                page is offline.
            </p>
            <button id="retry" type="button">Try again</button>
        </main>
        <script>
            document
                .getElementById('retry')
                .addEventListener('click', function () {
                    window.location.reload();
                });
        </script>
    </body>
</html>
